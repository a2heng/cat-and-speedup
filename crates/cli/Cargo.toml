[package]
name = "cut-speedup"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
whisper = ["cut-speedup-asr/whisper"]
gpu-vulkan = ["cut-speedup-asr/gpu-vulkan"]
gpu-cuda = ["cut-speedup-asr/gpu-cuda"]

[[bin]]
name = "cut-speedup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cut-speedup-asr = { path = "../asr", default-features = false }
cut-speedup-core = { path = "../core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
